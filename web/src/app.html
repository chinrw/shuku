<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<!-- 浏览器默认最多放大 5 倍左右，精细的大图看不清细节，放宽到 10 倍（浏览器允许的上限）。 -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=10, viewport-fit=cover"
		/>
		<meta name="color-scheme" content="dark light" />
		<meta name="theme-color" content="#34353b" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#e3e0d1" media="(prefers-color-scheme: light)" />
		<!-- HTTPS 下可以装成应用，Service Worker 在 src/service-worker；局域网 HTTP 下 manifest 只管“添加到主屏幕”后的外观和图标。 -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="书库" />
		<title>Shuku</title>
		<!-- 网页端的代码加载前先套上上次的配色（src/lib/themes.ts 的 applyTheme 存的），打开时不闪默认色。 -->
		<script>
			try {
				const saved = JSON.parse(localStorage.getItem('shuku.theme'));
				const light = matchMedia('(prefers-color-scheme: light)').matches;
				const theme = saved[light ? 'light' : 'dark'];
				const root = document.documentElement;
				root.dataset.theme = theme.id;
				root.style.colorScheme = theme.scheme;
				for (const [token, value] of Object.entries(theme.colors)) {
					root.style.setProperty('--' + token, value);
				}
				for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
					meta.content = saved[meta.media.includes('light') ? 'light' : 'dark'].colors.bg;
				}
			} catch {
				// 第一次打开或者存储不可用，等根布局按设置套用。
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
