<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<!-- 浏览器默认最多放大 5 倍左右，精细的大图看不清细节，放宽到 10 倍（浏览器允许的上限）。 -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=10, viewport-fit=cover"
		/>
		<meta name="color-scheme" content="dark light" />
		<meta name="theme-color" content="#34353b" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#e3e0d1" media="(prefers-color-scheme: light)" />
		<!-- 局域网 HTTP 下没有 Service Worker，manifest 只负责“添加到主屏幕”后的全屏外观和图标。 -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="书库" />
		<title>Shuku</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
