[package]
name = "shuku-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "shuku"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arc-swap = "1"
avif-decode = { version = "3", default-features = false }
axum = "0.8"
bytemuck = "1"
clap = { version = "4", features = ["derive", "env"] }
fast_image_resize = { version = "6", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
jxl-oxide = { version = "0.12", default-features = false, features = ["image"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shuku-archive = { path = "../shuku-archive" }
shuku-index = { path = "../shuku-index" }
shuku-store = { path = "../shuku-store" }
tempfile = "3"
thiserror.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"
walkdir = "2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["avif"] }
tower = { version = "0.5", features = ["util"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
zune-core = "0.5"
zune-jpegxl = "0.5"
