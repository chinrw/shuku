[package]
name = "shuku-migrate-lrr"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "One-off import of LANraragi metadata into Shuku"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
redis = { version = "1.8.0", default-features = false }
serde_json = "1.0.154"
shuku-store = { path = "../shuku-store" }
thiserror.workspace = true

[dev-dependencies]
rusqlite = "0.38"
tempfile = "3"
