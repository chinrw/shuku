[package]
name = "shuku-metadata"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Built-in metadata providers for Shuku: filename, ComicInfo, E-Hentai and tag translation"

[dependencies]
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
shuku-store = { path = "../shuku-store" }
thiserror.workspace = true
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
