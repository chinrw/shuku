name: Release

on:
  push:
    tags: ["v*"]

# 构建作业只有读权限；install-nix-action 默认把作业令牌写进 Nix 配置，
# 所以写权限只给不运行第三方代码的发布作业。
permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      # 标签名会进入文件名和 gh 的参数，gh 把附件参数里的 # 当作显示名分隔符。
      - name: Check tag format
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag $TAG is not vX.Y.Z or vX.Y.Z-suffix"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  server:
    needs: tag
    uses: ./.github/workflows/server-binary.yml
    with:
      revision: ${{ github.sha }}
      label: ${{ github.ref_name }}

  # 桌面和 Android 客户端。等 tag 检查完标签格式再开始，版本号去掉开头的 v。
  clients:
    needs: tag
    uses: ./.github/workflows/clients.yml
    with:
      version: ${{ needs.tag.outputs.version }}
    secrets: inherit

  publish:
    needs: [server, clients]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release
          path: dist

      - uses: actions/download-artifact@v7
        with:
          pattern: client-*
          merge-multiple: true
          path: dist/clients

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist/clients && sha256sum -- * > SHA256SUMS)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            "dist/shuku-${TAG}-x86_64-linux.tar.gz" \
            "dist/shuku-${TAG}-x86_64-linux.tar.gz.sha256" \
            dist/clients/*
