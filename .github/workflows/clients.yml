name: Clients

# 桌面（Linux、Windows、macOS）和 Android 客户端。客户端只包含 app/ 下的文件，网页端由服务器
# 提供，所以只在 app/ 变化时构建。正式版传入标签只用于确定下载地址，不覆盖客户端版本。
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/clients.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: "正式版下载所在的 v* 标签，独立 main 构建发到 nightly"
        type: string
        default: ""
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

concurrency:
  group: clients-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUBLISH: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || inputs.release_tag != '') }}
  SHUKU_CLIENT_CHANNEL: ${{ inputs.release_tag && 'stable' || 'nightly' }}
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # 与 flake 里的 cargo-tauri 同一版本。
  TAURI_CLI: "@tauri-apps/cli@2.12.4"
  TAURI_CLI_VERSION: "2.12.4"
  TAURI_CLI_LINUX_SHA256: 820ae3c7580ca637cad15f65638960ee2a96e5a491e224691c86d6f25e6c9e8a

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check client release identity
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 app/release.py --base "$BASE"
          python3 -B app/test/release_manifest.py
      - name: Server list tests
        run: node --test 'app/test/*.test.js'

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 桌面端只验证能编译和链接，不发布安装包。
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-latest
            bundles: nsis
            name: windows-x86_64
          - os: macos-latest
            bundles: app,dmg
            target: universal-apple-darwin
            name: macos-universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev

      # 通用二进制要同时编译 Intel 和 Apple Silicon 两个目标。
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "${{ matrix.target }}" = universal-apple-darwin ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - name: Build
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.PUBLISH == 'true' && runner.os != 'Linux' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.PUBLISH == 'true' && runner.os != 'Linux' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          args=(--ci)
          if [ "$RUNNER_OS" = Linux ]; then
            args+=(--no-bundle)
          else
            args+=(--bundles "${{ matrix.bundles }}")
            if [ "$PUBLISH" = true ]; then
              : "${TAURI_SIGNING_PRIVATE_KEY:?Missing desktop updater signing key}"
              : "${UPDATER_PUBLIC_KEY:?Missing desktop updater public key}"
              node -p 'JSON.stringify({
                bundle: {createUpdaterArtifacts: true, macOS: {bundleVersion: require("./tauri.conf.json").version.split("+")[1]}},
                plugins: {updater: {pubkey: process.env.UPDATER_PUBLIC_KEY.trim()}}
              })' > tauri.updater-ci.json
              args+=(--config tauri.updater-ci.json)
            fi
          fi
          if [ -n "${{ matrix.target }}" ]; then args+=(--target "${{ matrix.target }}"); fi
          npx --yes "$TAURI_CLI" build "${args[@]}"

      - name: Collect client installers
        if: runner.os != 'Linux'
        run: |
          dist="$GITHUB_WORKSPACE/dist"
          mkdir -p "$dist"
          bundle=target/${{ matrix.target || '.' }}/release/bundle
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$bundle"/nsis/*.exe "$dist/shuku-windows-x86_64.setup.exe"
            if [ "$PUBLISH" = true ]; then cp "$bundle"/nsis/*.exe.sig "$dist/shuku-windows-x86_64.setup.exe.sig"; fi
          else
            cp "$bundle"/dmg/*.dmg "$dist/shuku-macos-universal.dmg"
            if [ "$PUBLISH" = true ]; then
              cp "$bundle"/macos/*.app.tar.gz "$dist/shuku-macos-universal.app.tar.gz"
              cp "$bundle"/macos/*.app.tar.gz.sig "$dist/shuku-macos-universal.app.tar.gz.sig"
            fi
          fi

      - uses: actions/upload-artifact@v7
        if: runner.os != 'Linux'
        with:
          name: client-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # 只构建 arm64，手机和平板几乎都是它；runner 自带 Android SDK 和 NDK。
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android

      # Android 工程的 Gradle 任务回调 `cargo tauri android android-studio-script`（见
      # gen/android/buildSrc 的 BuildTask.kt），所以这里要 cargo 子命令形式的 CLI，npm 的不行。
      # 用 Tauri 发布的预编译版本，按固定的 SHA-256 校验。
      - name: Install cargo-tauri
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download "tauri-cli-v$TAURI_CLI_VERSION" --repo tauri-apps/tauri \
            --pattern cargo-tauri-x86_64-unknown-linux-gnu.tgz
          echo "$TAURI_CLI_LINUX_SHA256  cargo-tauri-x86_64-unknown-linux-gnu.tgz" | sha256sum -c -
          tar xzf cargo-tauri-x86_64-unknown-linux-gnu.tgz cargo-tauri
          install cargo-tauri "$HOME/.cargo/bin/cargo-tauri"

      # 签名密码由 Gradle 直接从环境变量读，见 gen/android/app/build.gradle.kts。没配置这几个
      # secrets 的非发布构建用调试密钥，发布构建必须沿用固定证书。
      - name: Build
        env:
          KEYSTORE: ${{ env.PUBLISH == 'true' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$PUBLISH" = true ]; then
            : "${KEYSTORE:?Missing Android release keystore}" "${ANDROID_KEYSTORE_PASSWORD:?}" "${ANDROID_KEY_ALIAS:?}" "${ANDROID_KEY_PASSWORD:?}"
          fi
          if [ -n "$KEYSTORE" ]; then
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            echo "$KEYSTORE" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          else
            echo "::warning::Android release signing secrets are not set; the APK is signed with a throwaway debug key"
          fi
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          args=(--ci --apk --target aarch64)
          cargo tauri android build "${args[@]}"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Collect APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          apk=$(find gen/android/app/build/outputs/apk -name '*-release.apk' | head -n 1)
          test -n "$apk"
          if [ "$PUBLISH" = true ]; then
            tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
            cert=$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            test "$cert" = e920b8aac11cae58c8dc9d4aa76d3cf11bc8946b57ffe24bde226705661589d6
            version=$(jq -r .version tauri.conf.json)
            "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging"
            grep -F "package: name='io.github.chinrw.shuku' versionCode='${version##*+}' versionName='$version'" "$RUNNER_TEMP/apk-badging"
          fi
          cp "$apk" "$GITHUB_WORKSPACE/dist/shuku-android-arm64.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: client-android-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  manifest:
    needs: [test, desktop, android]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: client-*
          merge-multiple: true
          path: dist
      - name: Verify desktop signatures with the embedded public key
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          printf '%s' "$UPDATER_PUBLIC_KEY" | base64 --decode > "$RUNNER_TEMP/updater.pub"
          for signature in dist/*.sig; do
            base64 --decode "$signature" > "$RUNNER_TEMP/update.minisig"
            minisign -Vm "${signature%.sig}" -p "$RUNNER_TEMP/updater.pub" -x "$RUNNER_TEMP/update.minisig"
          done
      - name: Generate client update manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag || 'nightly' }}
        run: python3 app/release.py --tag "$RELEASE_TAG" --assets dist
      - uses: actions/upload-artifact@v7
        with:
          name: client-manifest
          path: dist/client-update.json
          retention-days: 14
