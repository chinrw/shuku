name: Dependabot auto-merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  patch:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # 这里只读取 Dependabot 的更新信息，不检出或运行 PR 的代码。
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata
        with:
          github-token: ${{ github.token }}

      - if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
