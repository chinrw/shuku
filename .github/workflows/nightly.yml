name: Publish nightly

on:
  workflow_run:
    workflows: [Clients]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  server:
    # 只发布本仓库 main 的独立构建，不接收 PR 或正式版工作流的产物。
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    permissions:
      contents: read
    uses: ./.github/workflows/server-binary.yml
    with:
      revision: ${{ github.event.workflow_run.head_sha }}
      label: nightly

  publish:
    needs: server
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency: publish-nightly-clients
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      BUILD_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: client-*
          merge-multiple: true
          path: bundles

      - uses: actions/download-artifact@v7
        with:
          name: release
          path: server

      - name: Prepare downloads
        run: |
          mkdir dist
          (cd server && sha256sum --check shuku-nightly-x86_64-linux.tar.gz.sha256)
          mv server/shuku-nightly-x86_64-linux.tar.gz dist/
          mv bundles/shuku-* bundles/client-update.json dist/
          (cd dist && sha256sum shuku-* client-update.json > SHA256SUMS)

      - name: Publish development builds
        run: |
          tag=nightly
          title='Shuku Nightly'
          notes="Linux x86_64: download \`shuku-nightly-x86_64-linux.tar.gz\` for the static Shuku server binaries and web interface.
          Client installers are available for Android, Windows, and macOS.

          [Source commit]($GITHUB_SERVER_URL/$GH_REPO/commit/$SOURCE_SHA) · [Server build]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID) · [Client builds]($BUILD_URL)"
          if ! gh release view "$tag" > /dev/null; then
            gh release create "$tag" --target "$SOURCE_SHA" --prerelease --latest=false \
              --title "$title" --notes "$notes" dist/*
            exit
          fi

          # 重跑旧的成功构建时，不把下载入口退回到较早的版本。
          status=$(gh api "repos/$GH_REPO/compare/$tag...$SOURCE_SHA" --jq .status)
          case "$status" in
            behind) exit 0 ;;
            identical|ahead) ;;
            *) echo "::error::The nightly tag and the source commit have diverged"; exit 1 ;;
          esac
          gh release upload "$tag" --clobber dist/shuku-*
          # 先上传安装包和签名，最后才让更新检查发现新版本。
          gh release upload "$tag" --clobber dist/SHA256SUMS dist/client-update.json
          assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
          for old in shuku-linux-x86_64.AppImage shuku-linux-x86_64.deb; do
            if grep -Fxq "$old" <<< "$assets"; then
              gh release delete-asset "$tag" "$old" --yes
            fi
          done
          gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$tag" -f sha="$SOURCE_SHA" --silent
          gh release edit "$tag" --prerelease --latest=false --title "$title" --notes "$notes"
